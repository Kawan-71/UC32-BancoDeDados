{% extends "base.html" %}

{% block conteudo %}

<h2>Editar Livro</h2>

<form method="POST">

    <label>Título:</label>
    <input
        type="text"
        name="titulo"
        value="{{ livro.titulo }}"
        required
    >

    <label>Ano:</label>
    <input
        type="number"
        name="ano"
        value="{{ livro.ano }}"
    >

    <label>Autor:</label>

    <select name="id_autor" required>

        {% for autor in autores %}

            <option
                value="{{ autor.id_autor }}"
                {% if autor.id_autor == livro.id_autor %}selected{% endif %}
            >
                {{ autor.nome }}
            </option>

        {% endfor %}

    </select>

    <label>Categoria:</label>

    <select name="id_categoria" required>

        {% for categoria in categorias %}

            <option
                value="{{ categoria.id_categoria }}"
                {% if categoria.id_categoria == livro.id_categoria %}selected{% endif %}
            >
                {{ categoria.nome }}
            </option>

        {% endfor %}

    </select>

    <button type="submit">Salvar Alterações</button>

</form>

{% endblock %}
